name: EthPhish CI

on:
  pull_request:
  push:
    branches: [master, main, develop, "feature/**"]

permissions:
  contents: read

jobs:
  quality:
    name: Go quality and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
      - name: Build
        run: go build -trimpath -o ethphish .
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  postgres-integration:
    name: PostgreSQL migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: ethphish
          POSTGRES_USER: ethphish
          POSTGRES_PASSWORD: integration-only
        options: >-
          --health-cmd "pg_isready -U ethphish -d ethphish"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify PostgreSQL migrations and readiness
        env:
          ETHPHISH_TEST_POSTGRES_DSN: host=localhost port=5432 user=ethphish password=integration-only dbname=ethphish sslmode=disable
        run: go test ./tests/integration -run TestPostgresMigrationsAndReadiness -count=1

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Container build and scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ethphish:${{ github.sha }}
      - name: Verify runtime user
        run: test "$(docker image inspect ethphish:${{ github.sha }} --format '{{.Config.User}}')" = "10001:10001"
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ethphish:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ethphish:${{ github.sha }}
          format: cyclonedx-json
          artifact-name: ethphish-sbom
