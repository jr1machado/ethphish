<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - {{.Training.Name}}</title>
    <style>
        body { font-family: 'Source Sans Pro', Helvetica, Arial, sans-serif; background: #f4f6f8; color: #1c222b; margin: 0; }
        .wrap { max-width: 720px; margin: 40px auto; padding: 0 20px; }
        .hero { background: linear-gradient(135deg, #1e3a5f 0%, #17998a 100%); border-radius: 10px; padding: 25px 30px; color: #fff; margin-bottom: 25px; }
        .hero h1 { margin: 0 0 6px 0; font-size: 24px; }
        .card { background: #fff; border-radius: 6px; padding: 20px 25px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
        .card h4 { margin-top: 0; }
        label { display: block; padding: 6px 0; cursor: pointer; }
        button { padding: 10px 24px; border: none; border-radius: 4px; background: #1e3a5f; color: #fff; font-weight: 700; cursor: pointer; }
        .error { background: #fdecea; color: #c62828; border-radius: 6px; padding: 12px 14px; margin-bottom: 16px; }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="hero">
            <h1>{{.Training.Name}} — Quiz</h1>
            <p>Answer every question, then submit.</p>
        </div>
        {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
        <form method="POST">
            <input type="hidden" name="gorilla.csrf.Token" value="{{.Token}}">
            {{range $q := .Training.Quiz.Questions}}
            <div class="card">
                <h4>{{$q.Text}}</h4>
                {{if eq $q.Type "true_false"}}
                <label><input type="radio" name="q_{{$q.Id}}" value="true" required> True</label>
                <label><input type="radio" name="q_{{$q.Id}}" value="false"> False</label>
                {{else}}
                {{range $opt := $q.OptionsList}}
                <label><input type="radio" name="q_{{$q.Id}}" value="{{$opt}}" required> {{$opt}}</label>
                {{end}}
                {{end}}
            </div>
            {{end}}
            <button type="submit">Submit Quiz</button>
        </form>
    </div>
</body>

</html>
