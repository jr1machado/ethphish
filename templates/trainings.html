{{define "body"}}
<div class="col-sm-9 col-sm-offset-3 col-md-10 col-md-offset-2 main">
    <div class="row">
        <h1 class="page-header">Trainings</h1>
    </div>
    <div id="flashes" class="row"></div>
    <div class="row">
        <button type="button" class="btn btn-primary" onclick="newTraining()" data-toggle="modal" data-backdrop="static" data-target="#trainingModal">
            <i class="fa fa-plus"></i> New Training</button>
    </div>
    <div id="loading">
        <i class="fa fa-spinner fa-spin fa-4x"></i>
    </div>
    <div id="emptyMessage" class="row" style="display:none;">
        <div class="alert alert-info">No trainings created yet. Let's create one!</div>
    </div>
    <div class="row">
        <table id="trainingTable" class="table" style="display:none;">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Lessons</th>
                    <th>Quiz</th>
                    <th class="no-sort"></th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<!-- Training modal -->
<div class="modal fade" id="trainingModal" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document" style="width: 80% !important;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                <h4 class="modal-title" id="trainingModalLabel">New Training</h4>
            </div>
            <div class="modal-body">
                <input type="hidden" id="trainingId" value="" />
                <div class="form-group">
                    <label class="control-label" for="trainingName">Training Name</label>
                    <input type="text" class="form-control" id="trainingName" placeholder="Training name" />
                </div>
                <div class="form-group">
                    <label class="control-label" for="trainingDescription">Description</label>
                    <textarea class="form-control" id="trainingDescription" rows="2"></textarea>
                </div>
                <hr />
                <h5>Lessons</h5>
                <table class="table table-condensed" id="lessonTable">
                    <thead><tr><th>#</th><th>Title</th><th></th></tr></thead>
                    <tbody></tbody>
                </table>
                <div class="form-group">
                    <input type="text" class="form-control" id="newLessonTitle" placeholder="Lesson title" style="margin-bottom:8px;" />
                    <textarea class="form-control" id="newLessonHTML" placeholder="Lesson HTML content" rows="4"></textarea>
                    <button type="button" class="btn btn-default" style="margin-top:8px;" onclick="addLesson()"><i class="fa fa-plus"></i> Add Lesson</button>
                </div>
                <hr />
                <h5>Quiz</h5>
                <div class="form-inline" style="margin-bottom:10px;">
                    <label>Pass percent: <input type="number" class="form-control" id="quizPassPercent" value="80" min="1" max="100" style="width:80px;" /></label>
                    &nbsp;
                    <label>Max attempts (0 = unlimited): <input type="number" class="form-control" id="quizMaxAttempts" value="0" min="0" style="width:80px;" /></label>
                    &nbsp;
                    <button type="button" class="btn btn-default" onclick="saveQuizSettings()">Save Quiz Settings</button>
                </div>
                <table class="table table-condensed" id="questionTable">
                    <thead><tr><th>#</th><th>Type</th><th>Question</th><th></th></tr></thead>
                    <tbody></tbody>
                </table>
                <div class="form-group">
                    <select class="form-control" id="newQuestionType" style="margin-bottom:8px;">
                        <option value="multiple_choice">Multiple choice</option>
                        <option value="true_false">True / False</option>
                    </select>
                    <input type="text" class="form-control" id="newQuestionText" placeholder="Question text" style="margin-bottom:8px;" />
                    <input type="text" class="form-control" id="newQuestionOptions" placeholder="Options, comma-separated (multiple choice only)" style="margin-bottom:8px;" />
                    <input type="text" class="form-control" id="newQuestionAnswer" placeholder="Correct answer (must match an option, or true/false)" style="margin-bottom:8px;" />
                    <button type="button" class="btn btn-default" onclick="addQuestion()"><i class="fa fa-plus"></i> Add Question</button>
                </div>
                <hr />
                <h5>Assign to Group</h5>
                <div class="form-inline">
                    <select class="form-control" id="assignGroupSelect"></select>
                    <button type="button" class="btn btn-primary" onclick="assignToGroup()"><i class="fa fa-paper-plane"></i> Assign &amp; E-mail Group</button>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" id="modalSubmit" onclick="save()">Save changes</button>
            </div>
        </div>
    </div>
</div>
{{end}} {{define "scripts"}}
<script src="/js/dist/app/trainings.min.js"></script>
{{end}}
